<div class="container col-md-4 formCont">
    <h2>{{authHeadingText}}</h2>
  <form class="pt-4">
    <div class="mb-2">
      <label for="email" class="form-label">Email:</label>
      <input type="email" id="email" name="username" class="form-control" />
    </div>

    <div class="mb-2">
      <label for="firstName" class="form-label">First Name:</label>
      <input type="text" id="firstName" name="firstName" class="form-control" />
    </div>

    <div class="mb-2">
      <label for="middleName" class="form-label">Middle Name:</label>
      <input type="text" id="middleName" name="middleName" class="form-control" />
    </div>

    <div class="mb-2">
      <label for="lastName" class="form-label">Last Name:</label>
      <input type="text" id="lastName" name="lastName" class="form-control" />
    </div>

    <button type="submit" class="btn btn-primary mb-2">Submit</button>
    <a *ngIf="!loginFlag" class="mb-2" (click)="changeUserForm('Register')">New User? Registration</a>
    <a *ngIf="loginFlag" class="mb-2" (click)="changeUserForm('Login')">Existing User? Login</a>
  </form>
</div>
